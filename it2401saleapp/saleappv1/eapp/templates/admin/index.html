{% extends 'admin/master.html' %}
{% block body %}
<h1 class="text-center text success">Đăng nhập quản trị</h1>
<form method="post" action="/login">
  <div class="form-group">
    <label for="username">Tên đăng nhập:</label>
    <input type="username" class="form-control" placeholder="Nhập tên đăng nhập" id="usrename" name="username">
  </div>
  <div class="form-group">
    <label for="pwd">Mật khẩu:</label>
    <input type="password" class="form-control" placeholder="Nhập mật khẩu" id="pwd" name="password">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
